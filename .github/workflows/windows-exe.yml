name: Windows .exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Bog'liqliklar
        run: uv sync --extra dev

      - name: Testlar
        run: uv run pytest -q -p no:cacheprovider

      - name: Windows smoke testi
        run: uv run python scripts/windows_smoke.py

      - name: WebView2 smoke testi (video tarjima kanali)
        run: uv run python scripts/windows_webview_smoke.py

      - name: .exe yig'ish
        run: uv run pyinstaller nexus-windows.spec --noconfirm

      - name: .exe ishga tushishini tekshirish
        shell: pwsh
        run: |
          $p = Start-Process dist\Nexus.exe -ArgumentList "--version" -PassThru -Wait -RedirectStandardOutput ver.txt
          Get-Content ver.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Nexus.exe ochilib UI server javob berishini tekshirish
        shell: pwsh
        run: |
          $p = Start-Process dist\Nexus.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            if ($p.HasExited) { break }
          }
          Write-Host "Server javob berdi: $ok; jarayon tugaganmi: $($p.HasExited)"
          $log = Join-Path $env:USERPROFILE ".nexus\logs\nexus.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-windows
          path: dist/Nexus.exe
